name: Release

# Builds double-click packages for Windows, macOS and Linux and attaches them to a GitHub Release.
# Publish either by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0), or from the
# Actions tab: "Run workflow" with "publish" ticked creates the tag v<package.json version> on the
# selected commit and the release. Without "publish", the zips are only uploaded as run artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (tag v<package.json version>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bun cross-compiles every platform from this one Linux runner.
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: songstarr-packages
          path: release/out/*.zip
      - name: Work out the release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Songstarr ${{ steps.tag.outputs.name }}
          files: release/out/*.zip
          body_path: release/RELEASE_NOTES.md
