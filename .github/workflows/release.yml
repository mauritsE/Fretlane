name: Release

# Builds double-click packages for Windows, macOS and Linux and attaches them to a GitHub Release.
# Trigger: push a version tag (git tag v0.1.0 && git push origin v0.1.0), or run it manually from
# the Actions tab (manual runs upload the zips as workflow artifacts instead of publishing a release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bun cross-compiles every platform from this one Linux runner.
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: songstarr-packages
          path: release/out/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/out/*.zip
          body_path: release/RELEASE_NOTES.md
