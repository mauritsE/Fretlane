name: Release

# Builds the Fretlane desktop app natively on Linux, macOS and Windows, launches every build on its
# own OS, and only then attaches them to a GitHub Release.
# Publish either by pushing a version tag (git tag v0.2.0 && git push origin v0.2.0), or from the
# Actions tab: "Run workflow" with "publish" ticked creates the tag v<package.json version> on the
# selected commit and the release. Without "publish", the builds are only uploaded as run artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (tag v<package.json version>)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Never let electron-builder publish or look for signing certificates on its own.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:desktop -- --linux AppImage
      - name: Drive the desktop app window (Playwright + Electron)
        run: xvfb-run -a npx tsx e2e/desktop.ts
      - name: Launch the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: xvfb-run -a node release/smoke.mjs release/out/Fretlane-*.AppImage -- --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: release/out/*.AppImage

  macos:
    runs-on: macos-latest
    env:
      # With the Developer ID secrets (release/SIGNING.md) the Mac app is signed and notarised, so
      # macOS opens it without the "Open Anyway" step; without them it stays ad-hoc signed.
      SIGN_MAC: ${{ secrets.MAC_DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds Apple-chip and Intel disk images (the installers on the website) and zips, each
      # holding a Fretlane.app: ad-hoc signed, or Developer ID signed and notarised (below).
      - name: Build (ad-hoc signed)
        if: env.SIGN_MAC != 'true'
        run: npm run dist:desktop -- --mac
      - name: Build, sign with Developer ID and notarise
        if: env.SIGN_MAC == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          # The certificate's name without its "Developer ID Application: " prefix,
          # e.g. "Maurits Elzinga (AB12CD34EF)"; electron-builder refuses the prefix.
          MAC_IDENTITY: ${{ secrets.MAC_DEVELOPER_ID_NAME }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          npm run dist:desktop -- --mac \
            -c.mac.identity="$MAC_IDENTITY" \
            -c.mac.hardenedRuntime=true \
            -c.mac.entitlements=build/entitlements.mac.plist \
            -c.mac.entitlementsInherit=build/entitlements.mac.plist \
            -c.mac.notarize=true
          rm -f "$APPLE_API_KEY"
      - name: Verify signatures and launch both apps
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            zip=$(ls release/out/Fretlane-*-mac-$arch.zip)
            rm -rf "check-$arch" && mkdir "check-$arch" && ditto -x -k "$zip" "check-$arch"
            codesign --verify --deep --strict --verbose=2 "check-$arch/Fretlane.app"
            if [ "$SIGN_MAC" = "true" ]; then
              # What Gatekeeper decides for a downloaded copy: must say "source=Notarized Developer ID".
              spctl --assess --type execute -vv "check-$arch/Fretlane.app" 2>&1 | tee "spctl-$arch.txt"
              grep -q "Notarized Developer ID" "spctl-$arch.txt"
              xcrun stapler validate "check-$arch/Fretlane.app"
            fi
          done
          node release/smoke.mjs check-arm64/Fretlane.app/Contents/MacOS/Fretlane
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            # Rosetta translates Electron on first launch, which can take minutes on a CI machine.
            node release/smoke.mjs check-x64/Fretlane.app/Contents/MacOS/Fretlane --arch x86_64 --timeout 300 -- --disable-gpu
          else
            echo "::warning::Rosetta is not available on this runner; the Intel app was verified but not launched."
          fi
      - name: Check the disk images and launch the app installed from one
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            dmg=$(ls release/out/Fretlane-*-mac-$arch.dmg)
            hdiutil verify "$dmg"
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
            # What the user sees: the app and a link to drag it onto.
            ls -la "$mnt"
            test -d "$mnt/Fretlane.app"
            test -L "$mnt/Applications"
            codesign --verify --deep --strict --verbose=2 "$mnt/Fretlane.app"
            if [ "$SIGN_MAC" = "true" ]; then
              spctl --assess --type execute -vv "$mnt/Fretlane.app" 2>&1 | grep "Notarized Developer ID"
            fi
            # "Drag to Applications": copy it out the way Finder does, then launch the copy.
            rm -rf "installed-$arch" && mkdir "installed-$arch" && ditto "$mnt/Fretlane.app" "installed-$arch/Fretlane.app"
            hdiutil detach "$mnt"
          done
          node release/smoke.mjs installed-arm64/Fretlane.app/Contents/MacOS/Fretlane
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            release/out/*-mac-*.zip
            release/out/*-mac-*.dmg

  macos-intel:
    # Launches the Intel build natively on an Intel Mac. Diagnostic for now: it doesn't block
    # publishing until this runner type has proven reliable.
    needs: macos
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: app-macos
          path: out
      - name: Launch the Intel app natively, installed from its disk image
        run: |
          set -euo pipefail
          mnt=$(mktemp -d)
          hdiutil attach out/Fretlane-*-mac-x64.dmg -nobrowse -readonly -mountpoint "$mnt"
          ditto "$mnt/Fretlane.app" check-x64/Fretlane.app
          hdiutil detach "$mnt"
          codesign --verify --deep --strict check-x64/Fretlane.app
          node release/smoke.mjs check-x64/Fretlane.app/Contents/MacOS/Fretlane --timeout 180

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:desktop -- --win
      - name: Launch the unpacked app (tells app problems apart from installer problems)
        shell: pwsh
        run: |
          node release/smoke.mjs release/out/win-unpacked/Fretlane.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install silently and launch the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/out -Filter 'Fretlane-*-windows-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # A one-click installer may start the app when it finishes; stop it so the test launches a fresh copy.
          Start-Sleep -Seconds 3
          Get-Process Fretlane -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Fretlane.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Fretlane.exe was not installed' }
          Write-Host "Installed to $($exe.FullName)"
          node release/smoke.mjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: release/out/*-windows-setup.exe

  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Work out the release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Fretlane ${{ steps.tag.outputs.name }}
          files: out/*
          body_path: release/RELEASE_NOTES.md
          make_latest: true
